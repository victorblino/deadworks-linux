name: Sync upstream

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/Deadworks-net/deadworks.git
          git fetch upstream main
          if ! git merge --no-edit -X ours upstream/main; then
            if git diff --quiet --diff-filter=U; then
              exit 1
            fi

            while IFS= read -r -d '' path; do
              if git cat-file -e "HEAD:$path" 2>/dev/null; then
                git checkout --ours -- "$path"
                git add -- "$path"
              else
                git rm --ignore-unmatch -- "$path"
              fi
            done < <(git diff --name-only --diff-filter=U -z)

            git diff --quiet --diff-filter=U
            git diff --cached --check
            git commit --no-edit
          fi
          git push origin main
